<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servicios y Productos | Satiba Solutions</title>
  <meta name="description" content="Catálogo de soluciones digitales, desarrollo de software, redes y soporte técnico de Satiba Solutions en El Salvador." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-navbar"></div>

  <main>
    <!-- Encabezado -->
    <section class="page-header">
      <div class="container" data-aos="fade-up">
        <span class="section-eyebrow">Catálogo Corporativo</span>
        <h1>Nuestros Productos y Servicios</h1>
        <p>
          Soluciones flexibles adaptadas a tu hogar, comercio o institución. Selecciona los servicios que necesitas para solicitar una cotización personalizada.
        </p>
      </div>
    </section>

    <!-- Filtro interactivo y tarjetas -->
    <section class="section-padding section-bg-alt">
      <div class="container">
        <div class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-3 mb-5" data-aos="fade-up">
          <div id="servicios-tabs" class="filter-tabs" role="tablist" aria-label="Filtrar servicios por categoría">
            <button type="button" class="filter-tab-btn active" data-filter="Todos">Todos</button>
            <button type="button" class="filter-tab-btn" data-filter="Soluciones Digitales y Software">Soluciones Digitales y Software</button>
            <button type="button" class="filter-tab-btn" data-filter="Soporte Técnico y Equipos">Soporte Técnico y Equipos</button>
          </div>
          <a href="cotizador.html" class="btn btn-satiba-outline flex-shrink-0">
            <i class="bi bi-calculator"></i>
            Ir al Cotizador
            <span class="badge text-bg-success ms-1" data-satiba-cart-count style="display:none;">0</span>
          </a>
        </div>

        <div id="servicios-grid" class="row g-4"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
